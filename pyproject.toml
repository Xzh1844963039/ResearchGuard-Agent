[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "researchguard-agent"
version = "2.1.0"
description = "Bounded evidence-grounded research agent for scientific papers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Xzh1844963039" },
]
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.135,<0.140",
  "httpx>=0.28,<0.29",
  "llama-index>=0.14,<0.15",
  "numpy>=2,<3",
  "openai>=2,<3",
  "PyMuPDF>=1.27,<2",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2,<0.3",
  "requests>=2.32,<3",
  "sentence-transformers>=5,<6",
  "streamlit>=1.58,<2",
  "uvicorn[standard]>=0.49,<0.50",
]

[project.optional-dependencies]
ocr = [
  "rapidocr-onnxruntime>=1.4,<2",
]
dev = [
  "httpx>=0.28,<0.29",
]

[project.scripts]
researchguard = "researchguard.cli:main"

[tool.setuptools.packages.find]
include = ["researchguard*", "api*"]
