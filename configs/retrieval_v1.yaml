index:
  output_dir: "data/indexes/index_v1"
  indexing_config_path: "configs/indexing_v1.yaml"

retrieval:
  default_mode: "hybrid"
  default_top_k: 10
  default_candidate_k: 80
  max_top_k: 50
  deterministic_tiebreak: "chunk_id"

dense:
  backend: "chroma"
  chroma_config_path: "configs/chroma_v1.yaml"

hybrid:
  fusion: "rrf"
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0

filters:
  exclude_references_by_default: false

reranker:
  config_path: "configs/reranker_v1.yaml"

query_rewrite:
  config_path: "configs/query_rewrite_v1.yaml"

validation:
  benchmark_path: "data/eval/retrieval_v1_queries.jsonl"
  output_dir: "outputs/retrieval_validation_v1"
  top_k_values: [1, 3, 5, 10]
  candidate_k: 80
